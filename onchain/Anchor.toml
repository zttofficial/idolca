[toolchain]
anchor_version = "1.2.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
idolca_market = "4vQ6uRMFPRfU79JuwwriDVRoFsEZBCSW2FnsefwmtetD"

[programs.localnet]
idolca_market = "4vQ6uRMFPRfU79JuwwriDVRoFsEZBCSW2FnsefwmtetD"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
url = "https://api.mainnet-beta.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
