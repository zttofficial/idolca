[toolchain]
anchor_version = "1.2.1"

[features]
resolution = true
skip-lint = false

# 程序地址在第一次 `anchor keys sync` 時生成並同步到 lib.rs 的 declare_id!
[programs.localnet]
idolca_market = "11111111111111111111111111111111"

[programs.devnet]
idolca_market = "11111111111111111111111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# 本地驗證節點從主網複製 Metaplex Core 程序，測試裡才能真的鑄造和轉移 Core 資產
[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
